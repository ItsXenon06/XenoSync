spring.datasource.url=jdbc:postgresql://localhost:5432/XenoSync
spring.datasource.username=platform
spring.datasource.password=platform
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=8081

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7
jwt.absolute-token-expiry-days=30
# GitHub OAuth2 (Tier 1 - identity login)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# GitHub App (Tier 2 - repo access)
github.app.id=${GITHUB_APP_ID}
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH}

# Mailtrap (dev SMTP)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=https://xenosync.com
app.mail.from=noreply@xenosync.com